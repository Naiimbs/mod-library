<nav
  class="pagination"
  [class.pagination--sm]="size() === 'sm'"
  [class.pagination--lg]="size() === 'lg'"
  [attr.aria-label]="ariaLabel()"
>
  @if (showControls()) {
    <button
      type="button"
      class="pagination-item pagination-item--nav"
      [class.is-disabled]="atStart()"
      [disabled]="atStart()"
      [attr.aria-label]="previousLabel()"
      (click)="goTo(current() - 1)"
    >
      <svg
        class="pagination-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      @if (showLabels()) {
        <span>{{ previousLabel() }}</span>
      }
    </button>
  }
  @for (token of tokens(); track $index) {
    @if (token === dots) {
      <span class="pagination-item pagination-ellipsis" aria-hidden="true">{{ dots }}</span>
    } @else {
      <button
        type="button"
        class="pagination-item"
        [class.is-active]="token === current()"
        [class.is-disabled]="disabled()"
        [disabled]="disabled()"
        [attr.aria-current]="token === current() ? 'page' : null"
        [attr.aria-label]="pageLabel() + ' ' + formatPage()(token)"
        (click)="goTo(token)"
      >
        {{ formatPage()(token) }}
      </button>
    }
  }
  @if (showControls()) {
    <button
      type="button"
      class="pagination-item pagination-item--nav"
      [class.is-disabled]="atEnd()"
      [disabled]="atEnd()"
      [attr.aria-label]="nextLabel()"
      (click)="goTo(current() + 1)"
    >
      @if (showLabels()) {
        <span>{{ nextLabel() }}</span>
      }
      <svg
        class="pagination-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  }
</nav>
