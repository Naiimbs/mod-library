<div class="form-template__main">
  @if (stepsSlot()) {
    <aside class="form-template__stepper">
      <ng-content select="[modFormTemplateSteps]" />
    </aside>
  }
  <div class="form-content">
    @if (hasHeader()) {
      <div class="form-content__header">
        <ng-content select="[modFormTemplateBreadcrumb]" />
        @if (heading()) {
          <h1 class="form-content__title">{{ heading() }}</h1>
        }
        @if (description()) {
          <p class="form-content__description">{{ description() }}</p>
        }
        @if (requiredInfo()) {
          <div class="form-content__required-info">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
            <span>{{ requiredInfo() }}</span>
          </div>
        }
        <ng-content select="[modFormTemplateHeader]" />
      </div>
    }
    <div class="form-fields">
      <ng-content />
    </div>
    @if (actionsSlot()) {
      <div class="form-actions">
        <ng-content select="[modFormTemplateActions]" />
      </div>
    }
  </div>
</div>
