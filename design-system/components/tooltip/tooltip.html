<div class="content-header">
    <h1 class="content-title">Tooltip</h1>
    <p class="content-description">Tooltip component for additional information.</p>
</div>

<div class="component-preview">
    <div class="component-preview-title">Tooltip Positions</div>
    <div style="display: flex; gap: var(--spacing-3xl); flex-wrap: wrap;">
        <div style="position: relative; display: inline-block;">
            <button class="btn btn-secondary">Hover me</button>
            <div
                style="position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: var(--spacing-md); padding: var(--spacing-md) var(--spacing-lg); background: var(--gray-900); color: var(--text-oncolor-primary, #FFFFFF); font-size: var(--font-size-xs); border-radius: 6px; white-space: nowrap;">
                Tooltip text
            </div>
        </div>
    </div>
</div>
