<div class="content-header">
    <h1 class="content-title">Tooltip</h1>
    <p class="content-description">Tooltip component for additional information.</p>
</div>

<div class="component-preview">
    <div class="component-preview-title">Tooltip Positions</div>
    <div style="display: flex; gap: 24px; flex-wrap: wrap;">
        <div style="position: relative; display: inline-block;">
            <button class="btn btn-secondary">Hover me</button>
            <div
                style="position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; padding: 8px 12px; background: #111927; color: #fff; font-size: 12px; border-radius: 6px; white-space: nowrap;">
                Tooltip text
            </div>
        </div>
    </div>
</div>
