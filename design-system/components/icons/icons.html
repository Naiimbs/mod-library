<div class="icons-page">

    <!-- Left: Icon Packs Sidebar -->
    <aside class="icons-sidebar">
        <h2 class="icons-sidebar-title">ICON PACKS</h2>
        <div id="icons-packs-list" class="icons-packs-list"></div>
    </aside>

    <!-- Right: Main Content -->
    <div class="icons-main">

        <!-- Header -->
        <div class="icons-header">
            <h1 class="icons-title">Icons</h1>
            <div class="icons-search-wrapper">
                <svg class="icons-search-icon" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="icons-search" class="icons-search-input"
                       placeholder="Search 4,029 icons..." autocomplete="off">
                <button id="icons-search-clear" class="icons-search-clear"
                        style="display:none;" aria-label="Clear search">&times;</button>
            </div>
        </div>

        <!-- Icons Grid -->
        <div id="icons-grid-container" class="icons-grid"></div>

    </div>

</div>

<!-- Icon Detail Modal -->
<div id="icons-modal-overlay" class="icons-modal-overlay" style="display:none;">
    <div class="icons-modal">
        <button id="icons-modal-close" class="icons-modal-close" aria-label="Close">&times;</button>

        <h2 id="icons-modal-title" class="icons-modal-title"></h2>
        <p id="icons-modal-subtitle" class="icons-modal-subtitle"></p>

        <div class="icons-modal-body">
            <!-- Preview Column -->
            <div class="icons-modal-preview">
                <div id="icons-modal-icon" class="icons-modal-icon-display"></div>
                <span id="icons-modal-preview-label" class="icons-modal-preview-label">Stroke Rounded</span>
            </div>

            <!-- Details Column -->
            <div class="icons-modal-details">
                <!-- Style Variants -->
                <div id="icons-modal-variants" class="icons-modal-variants"></div>

                <!-- Code Tabs -->
                <div class="icons-modal-tabs">
                    <button class="icons-modal-tab icons-modal-tab--active" data-tab="html">HTML</button>
                    <button class="icons-modal-tab" data-tab="css">CSS</button>
                    <button class="icons-modal-tab" data-tab="json">JSON</button>
                    <button class="icons-modal-tab" data-tab="svg">SVG</button>
                </div>

                <!-- Code Block -->
                <div class="icons-modal-code">
                    <pre><code id="icons-modal-code-content"></code></pre>
                    <div class="icons-modal-code-actions">
                        <button id="icons-modal-copy" class="icons-modal-action-btn" title="Copy code">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                        <button id="icons-modal-download" class="icons-modal-action-btn" title="Download SVG">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Style Classes -->
                <div class="icons-modal-classes">
                    <span class="icons-modal-classes-label">Style Classes:</span>
                    <code id="icons-modal-class-name"></code>
                    <button id="icons-modal-copy-class" class="icons-modal-copy-class-btn" title="Copy class name">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Copy Toast -->
<div id="icons-copy-toast" class="icons-copy-toast" aria-live="polite">Copied to clipboard!</div>
