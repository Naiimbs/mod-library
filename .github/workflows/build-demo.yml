# Builds the MOD demo site as a downloadable artifact.
# Run it by hand (Actions tab, "Run workflow"); it never runs on its own.
# The artifact is the static site for https://naiimbs.github.io/mod-library-demo/.
name: Build demo site

on:
  workflow_dispatch:
    inputs:
      base_href:
        description: Base path the site is served from
        default: /mod-library-demo/

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mod-angular/package-lock.json
      - run: npm ci
      - run: npx ng build demo --base-href "${{ inputs.base_href }}"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: mod-angular/dist/demo/browser
          if-no-files-found: error
          retention-days: 7
